name: Bug Report
description: Report a bug in ali
title: "[Bug]: "
labels: ["bug"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking time to contribute !
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also, what did you expect to happen?
      placeholder: My pc fried and...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce ?
      description: "Tell me how you got there"
      placeholder: "Type, enter, boom"
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment used
      description: "Your distro and python version"
      placeholder: "Nyarch Linux with Python 2.1"
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
